<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dash — Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;450;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
  <style>
    :root{
      /* Light theme — soft pastels, warm off-white */
      --bg:#F7F5F1;
      --bg-mesh-1: oklch(0.94 0.04 320);   /* lilac */
      --bg-mesh-2: oklch(0.95 0.04 200);   /* mint */
      --bg-mesh-3: oklch(0.95 0.04 70);    /* peach */
      --bg-mesh-4: oklch(0.96 0.03 30);    /* cream */
      --surface:#FFFFFF;
      --surface-2:#FBFAF7;
      --ink:#1A1814;
      --ink-2:#3A3733;
      --ink-3:#6E6A63;
      --ink-4:#A5A19A;
      --line:rgba(26,24,20,0.07);
      --line-2:rgba(26,24,20,0.13);

      --accent: oklch(0.62 0.18 295);      /* iris */
      --accent-soft: oklch(0.93 0.06 295);
      --accent-ink: #fff;

      /* Pastel tints used across KPI/chart surfaces */
      --tint-pink:   oklch(0.94 0.05 15);
      --tint-peach:  oklch(0.94 0.06 55);
      --tint-yellow: oklch(0.95 0.07 90);
      --tint-mint:   oklch(0.94 0.05 155);
      --tint-sky:    oklch(0.94 0.05 230);
      --tint-lilac:  oklch(0.93 0.06 295);

      --c-pink:   oklch(0.66 0.16 15);
      --c-peach:  oklch(0.72 0.14 55);
      --c-yellow: oklch(0.78 0.14 85);
      --c-mint:   oklch(0.66 0.12 155);
      --c-sky:    oklch(0.66 0.13 230);
      --c-lilac:  oklch(0.62 0.18 295);

      --danger: oklch(0.62 0.18 25);
      --warn:   oklch(0.74 0.14 75);
      --ok:     oklch(0.62 0.12 155);
      --info:   oklch(0.62 0.13 230);

      --pad: 22px;
      --gap: 14px;
      --row-h: 44px;
      --radius: 18px;
      --radius-sm: 12px;

      --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-display: "Instrument Serif", "Times New Roman", serif;
    }

    [data-theme="dark"]{
      --bg:#16151A;
      --bg-mesh-1: oklch(0.32 0.07 295);
      --bg-mesh-2: oklch(0.32 0.07 220);
      --bg-mesh-3: oklch(0.30 0.06 70);
      --bg-mesh-4: oklch(0.22 0.04 30);
      --surface:#1F1E24;
      --surface-2:#191820;
      --ink:#F1EFEA;
      --ink-2:#D4D2CD;
      --ink-3:#9C9A95;
      --ink-4:#6E6C68;
      --line:rgba(255,255,255,0.08);
      --line-2:rgba(255,255,255,0.14);
      --accent: oklch(0.74 0.16 295);
      --accent-soft: oklch(0.34 0.08 295);
      --tint-pink:   oklch(0.34 0.06 15);
      --tint-peach:  oklch(0.34 0.07 55);
      --tint-yellow: oklch(0.34 0.06 85);
      --tint-mint:   oklch(0.32 0.06 155);
      --tint-sky:    oklch(0.32 0.07 230);
      --tint-lilac:  oklch(0.32 0.08 295);
    }

    [data-density="compact"]{--pad:14px;--gap:10px;--row-h:36px;--radius:14px;--radius-sm:10px}
    [data-density="comfy"]{--pad:28px;--gap:18px;--row-h:52px}

    *{box-sizing:border-box}
    html,body,#root{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font-family:var(--font-sans);font-feature-settings:"ss01","cv11";
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
      overflow:hidden;
    }
    body::before{
      content:"";position:fixed;inset:-10vw;z-index:0;pointer-events:none;
      background:
        radial-gradient(40vw 36vw at 8% 12%,  var(--bg-mesh-1) 0%, transparent 60%),
        radial-gradient(38vw 38vw at 92% 18%, var(--bg-mesh-2) 0%, transparent 62%),
        radial-gradient(44vw 36vw at 78% 92%, var(--bg-mesh-3) 0%, transparent 62%),
        radial-gradient(36vw 36vw at 14% 84%, var(--bg-mesh-4) 0%, transparent 60%);
      filter:blur(20px) saturate(110%);
      opacity:.85;
    }
    button{font:inherit;color:inherit;cursor:default}

    /* ── Shell ──────────────────────────────────────────────── */
    .shell{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;height:100%;}
    .shell[data-sidebar="collapsed"]{grid-template-columns:62px 1fr}
    .sidebar{padding:18px 12px;display:flex;flex-direction:column;gap:4px;}
    .sidebar-inner{
      background:rgba(255,255,255,0.55);
      backdrop-filter:blur(20px) saturate(140%);
      -webkit-backdrop-filter:blur(20px) saturate(140%);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:14px 10px;
      display:flex;flex-direction:column;
      height:100%;min-height:0;
    }
    [data-theme="dark"] .sidebar-inner{background:rgba(31,30,36,0.62)}
    .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;text-decoration:none;color:inherit}
    .brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-style:italic;font-size:22px;line-height:1;letter-spacing:-0.04em;flex-shrink:0}
    .brand-name{font-family:var(--font-display);font-size:24px;line-height:1;letter-spacing:-0.02em;font-style:italic;white-space:nowrap}
    .nav-group-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-4);padding:14px 10px 6px;font-weight:500}
    .nav{display:flex;flex-direction:column;gap:2px}
    .nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-size:13px;font-weight:450;cursor:default;position:relative;white-space:nowrap;overflow:hidden}
    .nav a:hover{background:rgba(26,24,20,0.05);color:var(--ink)}
    [data-theme="dark"] .nav a:hover{background:rgba(255,255,255,0.05)}
    .nav a.active{background:var(--ink);color:var(--bg)}
    [data-theme="dark"] .nav a.active{background:var(--accent);color:#fff}
    .nav-ico{width:16px;height:16px;flex-shrink:0;color:currentColor;opacity:.7}
    .nav a.active .nav-ico{opacity:1}
    .nav-count{margin-left:auto;font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
    .nav a.active .nav-count{color:rgba(255,255,255,0.65)}
    [data-sidebar="collapsed"] .brand-name,
    [data-sidebar="collapsed"] .nav a span:not(.nav-ico-wrap),
    [data-sidebar="collapsed"] .nav-group-label,
    [data-sidebar="collapsed"] .nav-count,
    [data-sidebar="collapsed"] .who{display:none}
    [data-sidebar="collapsed"] .nav a{justify-content:center;padding:8px 0}
    [data-sidebar="collapsed"] .sidebar-foot{justify-content:center}

    .sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
    .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg, var(--tint-peach), var(--tint-lilac));display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ink);flex-shrink:0;font-family:var(--font-mono)}
    .who{font-size:12.5px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .who .role{color:var(--ink-4);font-size:11px}

    /* ── Topbar ─────────────────────────────────────────────── */
    .main{display:flex;flex-direction:column;min-width:0;overflow:hidden;padding:18px 18px 18px 0}
    .topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;min-height:54px}
    [data-theme="dark"] .topbar{background:rgba(31,30,36,0.62)}
    .crumbs{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em}
    .crumbs b{color:var(--ink);font-weight:500;font-family:var(--font-sans);text-transform:none;letter-spacing:0;font-size:14px}
    .topbar .spacer{flex:1}
    .search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);padding:6px 12px;border-radius:10px;min-width:240px;color:var(--ink-3);font-size:12.5px}
    .search input{background:transparent;border:0;outline:none;color:var(--ink);font:inherit;width:100%}
    .kbd{font-family:var(--font-mono);font-size:10px;color:var(--ink-4);padding:2px 5px;border:1px solid var(--line);border-radius:4px;flex-shrink:0}
    .icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);position:relative}
    .icon-btn:hover{background:var(--surface)}
    .icon-btn .badge{position:absolute;top:-3px;right:-3px;background:var(--c-pink);color:#fff;font-size:9px;font-family:var(--font-mono);font-weight:600;padding:1px 5px;border-radius:99px;border:2px solid var(--bg);line-height:1.2}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:500;color:var(--ink)}
    .btn:hover{background:var(--surface)}
    .btn.lg{padding:10px 18px;font-size:13px}
    .btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .btn-primary:hover{background:#000;color:#fff}
    [data-theme="dark"] .btn-primary{background:var(--ink);color:var(--bg)}
    .btn-accent{background:var(--accent);color:#fff;border-color:transparent}
    .btn-ghost{border-color:transparent;background:transparent}
    .btn-ghost:hover{background:var(--surface-2)}

    .content{flex:1;overflow:auto;padding:0 4px 40px 0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
    .content::-webkit-scrollbar{width:10px}
    .content::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid var(--bg);background-clip:content-box}

    /* ── Page header ────────────────────────────────────────── */
    .page-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;padding:0 4px}
    .page-hd h1{margin:0;font-family:var(--font-display);font-size:44px;line-height:1.02;letter-spacing:-0.02em;font-weight:400}
    .page-hd h1 i{font-style:italic;color:var(--ink-3)}
    .page-hd p{margin:8px 0 0;color:var(--ink-3);font-size:13.5px;max-width:56ch}
    .page-hd .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

    .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px}
    .seg button{padding:5px 12px;border-radius:99px;border:0;background:transparent;color:var(--ink-3);font-size:12px;font-weight:500}
    .seg button.on{background:var(--ink);color:var(--bg)}

    /* ── Cards ──────────────────────────────────────────────── */
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden}
    .card h3{margin:0;font-size:14px;font-weight:550;letter-spacing:-0.005em}
    .card-hd{padding:16px 18px 8px;display:flex;align-items:center;gap:10px}
    .card-hd .right{margin-left:auto;display:flex;gap:6px;align-items:center}
    .card-hd .sub{font-size:11.5px;color:var(--ink-3);margin-left:6px}
    .muted{color:var(--ink-3)}
    .num{font-variant-numeric:tabular-nums}

    /* ── KPI strip ──────────────────────────────────────────── */
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
    .kpi{padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:148px;border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden}
    .kpi.tint-pink  {background:linear-gradient(180deg, var(--tint-pink) 0%, var(--surface) 75%)}
    .kpi.tint-peach {background:linear-gradient(180deg, var(--tint-peach) 0%, var(--surface) 75%)}
    .kpi.tint-mint  {background:linear-gradient(180deg, var(--tint-mint) 0%, var(--surface) 75%)}
    .kpi.tint-sky   {background:linear-gradient(180deg, var(--tint-sky) 0%, var(--surface) 75%)}
    .kpi.tint-lilac {background:linear-gradient(180deg, var(--tint-lilac) 0%, var(--surface) 75%)}
    .kpi .lbl{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-2)}
    .kpi .lbl .ico{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,0.65);display:grid;place-items:center;color:var(--ink-2)}
    [data-theme="dark"] .kpi .lbl .ico{background:rgba(0,0,0,0.25)}
    .kpi .val{font-family:var(--font-display);font-size:46px;line-height:1;letter-spacing:-0.02em;display:flex;align-items:baseline;gap:6px;color:var(--ink)}
    .kpi .val small{font-family:var(--font-sans);font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0}
    .kpi .foot{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:auto}
    .trend{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-variant-numeric:tabular-nums;font-weight:500;font-size:11px}
    .trend.up{background:color-mix(in oklab, var(--ok) 18%, var(--surface)); color:var(--ok)}
    .trend.down{background:color-mix(in oklab, var(--danger) 18%, var(--surface)); color:var(--danger)}
    .trend.flat{background:var(--surface-2); color:var(--ink-3)}
    .spark{height:34px;width:100%;display:block;margin-top:4px}

    /* ── Two-up row ─────────────────────────────────────────── */
    .row-2{display:grid;grid-template-columns:1fr 1.4fr;gap:var(--gap);margin-top:var(--gap)}
    .row-3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:var(--gap);margin-top:var(--gap)}
    @media (max-width: 1180px){
      .row-2,.row-3{grid-template-columns:1fr}
      .kpis{grid-template-columns:repeat(2,1fr)}
    }

    /* ── Bubble chart (D4) ──────────────────────────────────── */
    .bubble-wrap{padding:0 8px 16px}
    .bubble-svg{width:100%;height:280px;display:block}
    .bubble-svg .ax text{fill:var(--ink-4);font-size:10px;font-family:var(--font-mono)}
    .bubble-svg .grid line{stroke:var(--line);stroke-dasharray:3 4}
    .bubble-svg .stage-lbl{fill:var(--ink-3);font-size:11px;font-family:var(--font-sans);font-weight:500;text-anchor:middle}
    .bubble{transition:transform .25s, opacity .15s;cursor:default}
    .bubble:hover{transform:scale(1.05);transform-origin:center}
    .bubble-lbl{fill:#fff;font-family:var(--font-mono);font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
    .bubble-lbl.dark{fill:var(--ink)}

    /* ── Donut (D4) ─────────────────────────────────────────── */
    .donut-wrap{padding:8px 18px 18px;display:flex;align-items:center;gap:20px}
    .donut-svg{flex-shrink:0}
    .donut-center{font-family:var(--font-display);font-size:46px;letter-spacing:-0.02em;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
    .donut-center-sub{font-family:var(--font-mono);font-size:10px;text-anchor:middle;dominant-baseline:central;fill:var(--ink-3);text-transform:uppercase;letter-spacing:.12em}
    .donut-legend{display:flex;flex-direction:column;gap:10px;font-size:12.5px;flex:1;min-width:0}
    .donut-legend .item{display:flex;align-items:center;gap:8px}
    .donut-legend .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
    .donut-legend .lbl{color:var(--ink-3);flex:1}
    .donut-legend .val{font-family:var(--font-mono);color:var(--ink);font-weight:500}

    /* ── Horizontal bars (D4) ───────────────────────────────── */
    .hbars{padding:6px 18px 18px}
    .hbar{display:grid;grid-template-columns:120px 1fr 50px;gap:12px;align-items:center;padding:7px 0;font-size:12px}
    .hbar .lane{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hbar .track{height:8px;background:var(--surface-2);border-radius:99px;position:relative;overflow:hidden}
    .hbar .fill{position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg, var(--c-lilac), var(--c-sky));width:var(--w)}
    .hbar.warn .fill{background:linear-gradient(90deg, var(--c-peach), var(--c-pink))}
    .hbar .pct{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);text-align:right}

    /* ── Activity list ──────────────────────────────────────── */
    .activity{padding:6px 8px 10px}
    .activity .row{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px}
    .activity .row:hover{background:var(--surface-2)}
    .act-dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:600;font-family:var(--font-mono)}
    .act-dot.t-pink{background:var(--tint-pink);color:var(--c-pink)}
    .act-dot.t-peach{background:var(--tint-peach);color:var(--c-peach)}
    .act-dot.t-mint{background:var(--tint-mint);color:var(--c-mint)}
    .act-dot.t-sky{background:var(--tint-sky);color:var(--c-sky)}
    .act-dot.t-lilac{background:var(--tint-lilac);color:var(--c-lilac)}
    .activity .ttl{font-size:13px;line-height:1.35}
    .activity .sub{font-size:11.5px;color:var(--ink-3)}
    .activity .time{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums;font-family:var(--font-mono)}

    /* ── Status / table view ────────────────────────────────── */
    .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px}
    .sum-cell{padding:14px 16px;border-radius:12px;display:flex;flex-direction:column;gap:4px}
    .sum-cell:hover{background:var(--surface-2)}
    .sum-cell.active{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
    .sum-cell .n{font-family:var(--font-display);font-size:32px;line-height:1;letter-spacing:-0.015em;display:flex;align-items:baseline;gap:8px}
    .sum-cell .n small{font-family:var(--font-mono);font-size:11px;color:var(--ink-4);font-weight:400}
    .sum-cell .lab{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
    .sum-cell .lab .pip{width:7px;height:7px;border-radius:2px}

    .table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    .table-toolbar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3);flex-wrap:wrap}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--ink-2)}
    .chip:hover{background:var(--surface)}
    .chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    [data-theme="dark"] .chip.active{background:var(--accent);color:#fff;border-color:transparent}
    table.data{width:100%;border-collapse:collapse;font-size:13px}
    table.data thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;font-weight:550;color:var(--ink-3);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;white-space:nowrap;font-family:var(--font-mono)}
    table.data thead th .sort-ico{opacity:0;margin-left:4px;font-size:10px}
    table.data thead th:hover .sort-ico, table.data thead th.sorted .sort-ico{opacity:1}
    table.data thead th.sorted{color:var(--ink)}
    table.data tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2)}
    table.data tbody tr:last-child td{border-bottom:0}
    table.data tbody tr:hover td{background:var(--surface-2)}
    table.data .name{color:var(--ink);font-weight:500}
    table.data .mono{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:1.7;white-space:nowrap}
    .pill .pip{width:6px;height:6px;border-radius:50%}
    .pill.s-ok      {background:color-mix(in oklab, var(--ok) 16%, var(--surface));     color:var(--ok)}      .pill.s-ok .pip{background:var(--ok)}
    .pill.s-transit {background:color-mix(in oklab, var(--c-sky) 16%, var(--surface));  color:var(--c-sky)}   .pill.s-transit .pip{background:var(--c-sky)}
    .pill.s-warn    {background:color-mix(in oklab, var(--warn) 18%, var(--surface));   color:var(--warn)}    .pill.s-warn .pip{background:var(--warn)}
    .pill.s-danger  {background:color-mix(in oklab, var(--danger) 18%, var(--surface)); color:var(--danger)}  .pill.s-danger .pip{background:var(--danger)}
    .pill.s-info    {background:color-mix(in oklab, var(--info) 16%, var(--surface));   color:var(--info)}    .pill.s-info .pip{background:var(--info)}
    .pill.s-mute    {background:var(--surface-2);color:var(--ink-3)}                                          .pill.s-mute .pip{background:var(--ink-4)}
    .pill.s-iris    {background:color-mix(in oklab, var(--accent) 16%, var(--surface)); color:var(--accent)}  .pill.s-iris .pip{background:var(--accent)}

    .progress{display:flex;align-items:center;gap:8px;min-width:120px}
    .progress .bar{flex:1;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden}
    .progress .bar i{display:block;height:100%;background:linear-gradient(90deg, var(--c-lilac), var(--c-sky));border-radius:99px}
    .progress .pct{font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);min-width:30px;text-align:right}

    /* ── Drop / paste / sample ──────────────────────────────── */
    .import-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:var(--gap);margin-bottom:14px}
    @media (max-width: 1180px){.import-row{grid-template-columns:1fr}}
    .drop{border:1.5px dashed var(--line-2);border-radius:var(--radius);padding:24px 22px;background:var(--surface);transition:.15s;display:flex;flex-direction:column;justify-content:center;gap:6px}
    .drop.over{border-color:var(--accent);background:var(--accent-soft)}
    .drop h4{margin:0;font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:8px}
    .drop p{margin:0;font-size:12px;color:var(--ink-3)}
    .drop .actions{display:flex;gap:8px;margin-top:8px}

    .paste{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:8px}
    .paste textarea{width:100%;flex:1;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--font-mono);font-size:11.5px;background:var(--surface-2);color:var(--ink);resize:none;outline:none}
    .paste textarea:focus{border-color:var(--accent)}

    .samples{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:8px}
    .samples .opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid transparent;cursor:default}
    .samples .opt:hover{background:var(--surface-2)}
    .samples .opt.on{background:var(--surface-2);border-color:var(--line)}
    .samples .opt .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-family:var(--font-mono);font-size:11px;font-weight:600}
    .samples .opt .ico.t-pink{background:var(--tint-pink);color:var(--c-pink)}
    .samples .opt .ico.t-mint{background:var(--tint-mint);color:var(--c-mint)}
    .samples .opt .ico.t-sky{background:var(--tint-sky);color:var(--c-sky)}
    .samples .opt .ttl{font-size:12.5px;line-height:1.3}
    .samples .opt .sub{font-size:11px;color:var(--ink-4);font-family:var(--font-mono)}

    .head-sm{font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-4);margin:0 0 6px}

    /* ── Splash ─────────────────────────────────────────────── */
    .splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9999;overflow:hidden}
    .splash.fade-out{animation:splash-out .9s forwards ease}
    @keyframes splash-out{to{opacity:0;visibility:hidden}}
    .splash::before{
      content:"";position:absolute;inset:-10vw;
      background:
        radial-gradient(40vw 38vw at 14% 18%, var(--bg-mesh-1) 0%, transparent 60%),
        radial-gradient(38vw 38vw at 86% 22%, var(--bg-mesh-2) 0%, transparent 62%),
        radial-gradient(44vw 36vw at 78% 88%, var(--bg-mesh-3) 0%, transparent 62%),
        radial-gradient(36vw 36vw at 18% 82%, var(--bg-mesh-4) 0%, transparent 60%);
      filter:blur(28px) saturate(120%);
      opacity:.95;
      animation:mesh-pulse 6s ease-in-out infinite alternate;
    }
    @keyframes mesh-pulse{from{transform:translate(0,0) rotate(0)}to{transform:translate(-1%,1%) rotate(2deg)}}
    .splash-stage{position:relative;width:min(820px,92vw);height:380px;display:grid;place-items:center;z-index:2}
    .splash-word{font-family:var(--font-display);font-size:clamp(120px,20vw,220px);line-height:1;letter-spacing:-0.045em;color:var(--ink);position:relative;z-index:3;display:inline-flex}
    .splash-word span{display:inline-block;opacity:0;transform:translateY(36px);filter:blur(10px);animation:letter-in 1.1s forwards cubic-bezier(.2,.7,.2,1)}
    .splash-word span:nth-child(1){animation-delay:.95s}
    .splash-word span:nth-child(2){animation-delay:1.10s}
    .splash-word span:nth-child(3){animation-delay:1.25s}
    .splash-word span:nth-child(4){animation-delay:1.40s}
    .splash-word i{font-style:italic;color:var(--accent)}
    @keyframes letter-in{to{opacity:1;transform:translateY(0);filter:blur(0)}}

    .splash-ribbon{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:normal}
    .splash-ribbon svg{width:100%;height:100%;overflow:visible}
    .ribbon-path{
      fill:none;stroke-linecap:round;stroke-linejoin:round;
      stroke-dasharray:100;stroke-dashoffset:100;
      animation:draw 2.6s .1s forwards cubic-bezier(.55,.05,.2,1);
      filter:drop-shadow(0 8px 24px color-mix(in oklab, var(--accent) 35%, transparent));
    }
    .ribbon-path.r1{stroke:url(#rib1);stroke-width:34;opacity:.95}
    .ribbon-path.r2{stroke:url(#rib2);stroke-width:18;opacity:.85;animation-delay:.35s}
    .ribbon-path.r3{stroke:var(--ink);stroke-width:1.5;opacity:.18;animation-delay:.2s}
    @keyframes draw{to{stroke-dashoffset:0}}

    .splash-tag{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.32em;text-transform:uppercase;color:var(--ink-3);opacity:0;animation:fade-up .9s 1.9s forwards ease;z-index:4;text-align:center}
    @keyframes fade-up{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
    .splash-tag .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 10px;vertical-align:2px}

    .app-mount{opacity:0;animation:app-in 1s .3s forwards ease-out}
    @keyframes app-in{to{opacity:1}}
    .app-mount.hidden{display:none}

    /* ── Misc ───────────────────────────────────────────────── */
    .hide{display:none !important}
    ::selection{background:var(--accent-soft);color:var(--ink)}
  </style>
</head>
